server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

# 1. Handle requests starting with /nl-BE/
    # ^~ prevents Nginx from evaluating regex blocks below for these requests
    location ^~ /nl-BE/ {
        rewrite ^/nl-BE/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # 2. Serve static assets directly for non-/nl-BE/ requests
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|map|json)$ {
        try_files $uri =404;
    }

    # 3. Fallback for root SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

       # implementation of health
       location /health {
          access_log off;
          add_header 'Content-Type' 'application/json';
          return 200 '{"status":"up"}';
        }
}